services:
  postgres:
    image: postgres:18
    container_name: antcode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: antcode
      POSTGRES_PASSWORD: antcode
      POSTGRES_DB: antcode_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antcode"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pgdata: