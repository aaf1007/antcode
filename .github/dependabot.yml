version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Prisma 8 RCs break between releases and its packages must move in
    # lockstep, so upgrade them by hand (see the prisma-8 skill's upgrade notes).
    ignore:
      - dependency-name: "prisma"
      - dependency-name: "@prisma/*"
      # typescript-eslint does not support TS 7 yet (typescript-eslint#10940).
      # Remove once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
